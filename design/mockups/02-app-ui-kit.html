/* ── 에셋 셀프 컨테인 처리 ─────────────────────────────────────────────
   로컬 이미지 경로(assets/**)는 번들에 포함하지 않고, 경로 문자열을
   해시하여 결정적(deterministic) 인라인 SVG 플레이스홀더로 치환한다.

/* 자유 입력 → 필드 추출. 관련 없는 입력·추상 입력·미지원 요청은 별도 사유로 반환한다. */
function extractFields(text) {
  const t = text.trim();
  const out = { fields: {}, reason: null, conflicts: [] };
  if (/사진(만|으로만|만으로)/.test(t) || /사진.*(영상|만들)/.test(t) && !/촬영/.test(t)) out.reason = "photo_only";
  if (!out.reason && /(뭐 ?먹|점심 ?뭐|날씨|주식|로또|안녕하세|심심)/.test(t)) out.reason = "off_topic";
  const m = t.match(/(\d+)\s*분/);
  if (m) { const v = +m[1]; out.fields.time = v <= 5 ? "5분 이내" : v <= 10 ? "10분 이내" : v <= 20 ? "20분 이내" : "30분 이상"; }
  if (/(30분|한 ?시간|1시간)/.test(t)) out.fields.time = "30분 이상";
  if (/얼굴\s*(없이|안|미노출|비노출|빼)|노출\s*(안|싫|없)/.test(t)) out.fields.face = "얼굴 없이 촬영";
  else if (/얼굴\s*(노출|나와|공개|가능|보여)/.test(t)) out.fields.face = "얼굴 노출 가능";
  const OBJ = [[/예약|문의/, "예약·문의 늘리기"], [/판매|주문|매출|팔고/, "주문·판매 늘리기"], [/방문|손님 ?오/, "매장 방문 늘리기"], [/신규|새 ?고객|처음 ?오/, "신규 고객 끌어오기"], [/재방문|단골|다시 ?오/, "재방문 유도"], [/신뢰|전문성|믿/, "신뢰·전문성 높이기"], [/알리|홍보|인지도|많이 ?보/, "더 많이 알리기"]];
  for (const [re, label] of OBJ) if (re.test(t)) { out.fields.objective = label; break; }
  const CATS = [[/신메뉴|메뉴|라떼|커피|음료|디저트|빵|김밥/, "메뉴"], [/분위기|공간|인테리어|뷰|테라스|좌석|한강/, "매장 공간·분위기"], [/이벤트|할인|혜택|쿠폰/, "이벤트·혜택·할인"], [/사장님|사장|직원|브랜드 ?이야기|철학/, "사람·브랜드 이야기"], [/오시는 ?길|주차|영업시간|예약 ?방법|찾아오/, "이용 정보"], [/후기|경력|인증|재료|원산지|위생/, "후기·신뢰·전문성"]];
  const hits = CATS.filter(([re]) => re.test(t)).map(([, label]) => label);
  if (hits.length) out.fields.category = hits[0];
  if (hits.length > 1) out.reason = out.reason || "multi_subject";
  out.multi = hits;
  const menu = STORE_CONTEXT.representative_menus.find(mm => t.includes(mm.name) || t.replace(/\s/g, "").includes(mm.name.replace(/\s/g, "")));
  if (menu) {
    out.fields.subject = menu.name;
    const pm = t.match(/([0-9][0-9,]{2,})\s*원/);
    if (pm && menu.price) { const v = +pm[1].replace(/,/g, ""); if (v !== menu.price) out.conflicts.push({ field: "대표 메뉴 가격", stored: menu.price.toLocaleString() + "원", input: v.toLocaleString() + "원" }); }
  }
  const abstract = /^(예쁘게|멋있게|잘 ?만들|알아서|아무거나|좋은 ?거)/.test(t) && t.length < 16;
  if (abstract) out.reason = out.reason || "too_abstract";
  /* 남은 문장에서 홍보 대상을 뽑되, 시간/얼굴/목적만 말한 문장에서는 절대 만들어내지 않는다 (§0.5 · §14.3) */
  if (!out.reason && !out.fields.subject && !menu && !abstract && hits.length <= 1) {
    const rest = t
      .replace(/[0-9]+\s*분\s*(이내|안에|정도|쯤)?/g, "")
      .replace(/(30\s*분\s*이상|한\s*시간|1\s*시간)/g, "")
      .replace(/얼굴\s*(없이|안|미노출|비노출|노출)\s*(촬영(?![할하])|가능|하고\s*싶어요?|해도\s*되(요|나요)?)?/g, "")
      .replace(/(예약|문의|판매|주문|매출|방문|신규|재방문|신뢰|전문성)[가-힣\s]{0,6}(늘리고|늘려|받고|끌고|높이고)\s*싶어요?/g, "")
      .trim();
    /* 동사구만 남은 조각("찍을 수 있어", "만들어줘")은 홍보 대상이 아니다 */
    const verbOnly = /^([가-힣\s]{0,4})?(찍|촬영|만들|올리|홍보|편집|시작|해)[가-힣\s]*$/.test(rest) || /^(할|하고|해|될|되|수|있어|있|없어|없|가능|싶어|해줘|주세요|좋아)/.test(rest) || /수\s*(있|없)/.test(rest);
    const subject = rest.replace(/\s*(을|를|이|가|은|는)?\s*(홍보|소개|보여\s*주|찍|촬영|만들)[가-힣\s]*$/, "").trim();
    /* 술어 꼬리만 남은 경우(할 수 있어요 등)에는 홍보 대상이 없다고 본다 */
    const STOP = /^(할|하고|해|해요|해줘|될|되|수|있|있어|있어요|없|없어|없어요|싶|싶어|싶어요|가능|가능해요|촬영|찍|찍고|만들|영상|정도|안에|이내|쯤|좀|잘|한번|그냥|주세요|주고|어요|요)$/;
    const tokens = subject.split(/\s+/).map(x => x.replace(/[.,!?~]/g, "")).filter(x => x && !STOP.test(x));
    if (!verbOnly && tokens.length > 0 && subject.length >= 2) out.fields.subject = subject;
  }
  return out;
}

/* 확정된 4개 필수값으로 실제 촬영 가능한 아이디어 3개를 만든다. */
function buildRecommendations(st) {
  const jong = w => { const c = (w || "").trim().slice(-1).charCodeAt(0); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0; };
  const eul = w => jong(w) ? "을" : "를";
  const iga = w => jong(w) ? "이" : "가";
  const subj = st.subject || "우리 매장";
  const objMeta = OBJECTIVES.find(o => o.label === st.objective) || OBJECTIVES[0];
  const timeMeta = FILMING_TIMES.find(f => f.label === st.time) || FILMING_TIMES[1];
  const noFace = st.face === "얼굴 없이 촬영";
  const ta = STORE_CONTEXT.trade_area;
  const priceLine = st.price ? ` (${st.price})` : "";
  const base = {
    objective: objMeta.label, primary_subject: subj, face_mode: st.face || "얼굴 없이 촬영",
    estimated_filming_time: timeMeta.est, cta_direction: objMeta.cta
  };
  const faceTag = noFace ? "#얼굴미노출" : "#얼굴노출가능";
  const timeTag = `#촬영시간${timeMeta.est.replace(/[^0-9]/g, "")}분`;
  const baseReasons = [`${st.category || "홍보 대상"} · ${subj}${priceLine} 에 바로 쓸 수 있는 구성이에요`, `${ta.characteristics[0]} · 주 타깃 ${ta.target_age_ranges.join("·")} 상권 분석상 반응 가능성이 높아요`];
  const hands = noFace ? "손" : "사장님";
  /* 장면을 생성한 다음 그 장면 수로 근거 문장을 만든다 — 말하는 컷 수와 카드에 보이는 장면 수는 항상 같다 */
  const angles = [
    { id: "rec1", badge: "가장 빠른 구성", title: `${subj} 빠른 소개 숏폼`, concept: "여러 컷을 나눠 찍고 자동으로 합치고 편집해주는 구성이에요.", tagsOverride: ["#촬영시간10분", "#2촬영", "#얼굴노출"], editing_direction: "첫 컷 0.6초 고정 후 빠른 컷 전환, 자막은 확인된 사실만", shots: [`${subj} 클로즈업 (화면 가득)`, `${hands}으로 집어 올리는 컷`, noFace ? "단면·질감 슬로우 컷" : "한입 리액션 컷", `${subj} 전체가 보이는 마무리 컷`, "자막이 들어가는 여백 컷", "매장 브랜드 컷"] },
    { id: "rec2", badge: "과정 중심", title: `${subj}${iga(subj)} 완성되는 과정을 담은 ${timeMeta.sec}초 영상`, concept: "만드는 순서를 그대로 보여줘 신뢰를 주는 구성이에요.", editing_direction: "현장음 살리고 컷마다 0.8초 유지, 마지막에 매장 브랜딩", shots: ["재료·준비 컷", `${hands} 작업 과정 (탑뷰)`, "완성 직전 마무리 동작", `${subj} 완성 컷`, "솜은 후 다시 보여주는 리플레이 컷", "사장님 한마디 자막 컷"] },
    { id: "rec3", badge: "현장 분위기", title: `${STORE.name} 현장 분위기와 함께 ${subj}${eul(subj)} 보여주는 ${timeMeta.sec}초 영상`, concept: "공간 → 대상 순서로 이어 붙여 방문 상상을 만드는 구성이에요.", editing_direction: "POV 흔들림 유지, 위치 태그 자막을 하단에 고정", shots: ["입구에서 매장 안으로 들어가는 POV", `${STORE_CONTEXT.photo_candidates[0]} 컷`, `${subj} 컷`, "자리에 놓이는 컷", "매장 전체가 보이는 와이드 컷", "위치 태그 마무리 컷"] }
  ];
  return angles.map(a => {
    const shots = a.shots.slice(0, timeMeta.cuts);
    const crew = a.id === "rec3" && !noFace ? "#최소2인" : "#1인촬영";
    return { ...base, ...a, shots, tags: a.tagsOverride || [timeTag, crew, faceTag], reasons: [...baseReasons, `촬영 가능 시간 ${timeMeta.label}에 맞춰 컷을 ${shots.length}개로 구성했어요`] };
  });
}

/* ── 이미지 경로 정규화 ──
   데이터에 담긴 로컬 경로(image/avatar/thumb/cover)를 __img 로 한 번에 통과시켜
   호출부에서 래핑을 빠뜨려도 깨진 이미지가 남지 않게 한다. */
(function () {
  var R = window.REALS, KEYS = ["image", "avatar", "thumb", "cover", "src"];
  var seen = new Set();
  function walk(v) {
    if (!v || typeof v !== "object" || seen.has(v)) return;
    seen.add(v);
    if (Array.isArray(v)) { v.forEach(walk); return; }
    Object.keys(v).forEach(function (k) {
      var val = v[k];
      if (typeof val === "string" && KEYS.indexOf(k) > -1 && /^assets\//.test(val)) v[k] = window.__img(val);
      else walk(val);
    });
  }
  walk(R);
})();

/* ── PhoneShell: 393x852 frame scaled to fit ── */
function PhoneShell({ children }) {
  const FRAME_W = 393, FRAME_H = 852;
  const stageRef = useRef(null);
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const el = stageRef.current; if (!el) return;
    const compute = () => {
      const next = Math.min((el.clientWidth - 16) / FRAME_W, (el.clientHeight - 16) / FRAME_H, 1);
      setScale(next > 0 ? next : 1);
    };
    compute();
    const ro = new ResizeObserver(compute); ro.observe(el);
    window.addEventListener("resize", compute);
    return () => { ro.disconnect(); window.removeEventListener("resize", compute); };
  }, []);
  return (
    <div ref={stageRef} className="reals-stage flex h-screen w-full items-center justify-center overflow-hidden">
      <div style={{ width: 393 * scale, height: 852 * scale }} className="relative shrink-0">
        <div className="absolute left-0 top-0 origin-top-left overflow-hidden bg-canvas shadow-[0_40px_120px_-20px_rgba(0,0,0,0.7)]" style={{ width: 393, height: 852, borderRadius: 48, transform: `scale(${scale})` }}>
          {children}
        </div>
      </div>
    </div>
  );
}

function digitsOnly(v) { return (v || "").replace(/\D/g, "").slice(0, 11); }

  const d = digitsOnly(v);
  if (!d) return "";
  if (d.startsWith("02")) {
    if (d.length <= 2) return d;
    if (d.length <= 5) return `${d.slice(0, 2)}-${d.slice(2)}`;
    if (d.length <= 9) return `${d.slice(0, 2)}-${d.slice(2, 5)}-${d.slice(5)}`;
    return `${d.slice(0, 2)}-${d.slice(2, 6)}-${d.slice(6, 10)}`;

  if (d.length <= 7) return `${d.slice(0, 3)}-${d.slice(3)}`;
  if (d.length <= 10) return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;

<script type="text/babel" data-presets="react">
/* ── 가로 뷰페이저 ──
   4개 탭 화면을 width:400% 트랙에 나란히 두고 translate3d 로 이동한다.
   실시간 진행률(0~3)은 버스로 흘려보내 탭바 캡슐이 손가락을 그대로 따라오게 한다.
   React 리렌더 없이 DOM 스타일을 직접 쓴다 — 60~120fps 유지 목적. */

const TabPagerBus = {
  p: 0,
  subs: new Set(),
  set(v) { this.p = v; this.subs.forEach(f => f(v)); },
  sub(f) { this.subs.add(f); f(this.p); return () => this.subs.delete(f); }
};

/* 스프링 물리: stiffness 350, damping 32, mass 1 */
const PAGER_SPRING = { k: 350, c: 32, m: 1 };
/* 스냅 임계치 */
const PAGER_SNAP = { ratio: 0.25, velocity: 500 };
/* 터치 앵글 판별: 수평 30° 콘 안에서만 가로 제스처로 인정 */
const ANGLE_TAN = Math.tan((30 * Math.PI) / 180);

function TabPager({ tabs, active, onChange, children }) {
  const hostRef = useRef(null);
  const trackRef = useRef(null);
  const st = useRef({ x: 0, v: 0, target: 0, w: 0, raf: 0, last: 0, drag: null }).current;
  const index = Math.max(0, tabs.indexOf(active));

  const paint = () => {
    const w = st.w || 1;
    if (trackRef.current) trackRef.current.style.transform = `translate3d(${st.x}px,0,0)`;
    TabPagerBus.set(Math.min(tabs.length - 1, Math.max(0, -st.x / w)));
  };

  /* 실제 경과 시간으로 적분 — 60/120Hz 어디서나 같은 물리 (고정 dt 는 화면 주사율에 끌려간다) */
  const tick = now => {
    st.raf = 0;
    const elapsed = Math.min(0.05, Math.max(0.001, (now - st.last) / 1000));
    st.last = now;
    const { k, c, m } = PAGER_SPRING;
    const h = 1 / 480;
    for (let t = 0; t < elapsed; t += h) {
      const step = Math.min(h, elapsed - t);
      const a = (-k * (st.x - st.target) - c * st.v) / m;
      st.v += a * step;
      st.x += st.v * step;
    }
    paint();
    if (Math.abs(st.x - st.target) > 0.15 || Math.abs(st.v) > 0.15) st.raf = requestAnimationFrame(tick);
    else { st.x = st.target; st.v = 0; paint(); }
  };
  const run = () => { if (!st.raf) { st.last = performance.now(); st.raf = requestAnimationFrame(tick); } };

  /* 폭 측정 + 활성 인덱스 → 목표 오프셋 */
  useEffect(() => {
    const el = hostRef.current; if (!el) return;
    const measure = () => {
      const w = el.clientWidth;
      const wasIdx = st.w ? Math.round(-st.x / st.w) : index;
      st.w = w; st.target = -index * w;
      if (!st.raf) { st.x = -wasIdx * w; paint(); }
    };
    measure();
    const ro = new ResizeObserver(measure); ro.observe(el);
    return () => { ro.disconnect(); cancelAnimationFrame(st.raf); st.raf = 0; };
  }, []);

  useEffect(() => {
    if (!st.w) return;
    st.target = -index * st.w;
    run();
  }, [index]);

  /* 뷰포트 밖 비디오 일시정지 — 메모리·디코더 점유 방지 */
  useEffect(() => {
    const host = hostRef.current; if (!host) return;
    host.querySelectorAll("[data-pager-panel]").forEach((panel, i) => {
      panel.querySelectorAll("video").forEach(v => {
        if (i === index) { if (v.dataset.autoplay === "true") v.play().catch(() => {}); }
        else if (!v.paused) v.pause();
      });
    });
  }, [index]);

  const onDown = e => {
    if (!e.isPrimary || !st.w) return;
    cancelAnimationFrame(st.raf); st.raf = 0;
    st.drag = { x0: e.clientX, y0: e.clientY, ox: st.x, axis: null, lx: e.clientX, lt: performance.now(), vx: 0 };
  };
  const onMove = e => {
    const d = st.drag; if (!d) return;
    const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (!d.axis) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      d.axis = Math.abs(dx) > Math.abs(dy) / ANGLE_TAN ? "x" : "y"; // 수평 ±30° 콘
      if (d.axis === "y") { st.drag = null; return; }               // 세로는 스크롤러에 양보
    }
    const now = performance.now(), dt = Math.max(8, now - d.lt);
    d.vx = ((e.clientX - d.lx) / dt) * 1000;
    d.lx = e.clientX; d.lt = now;
    let x = d.ox + dx;
    const min = -(tabs.length - 1) * st.w;
    if (x > 0) x = dx * 0.3;                       // 양 끝 러버밴딩
    else if (x < min) x = min + (x - min) * 0.3;
    st.x = x; st.v = 0; paint();
  };
  const onUp = () => {
    const d = st.drag; st.drag = null;
    if (!d || d.axis !== "x") return;
    const from = Math.round(-d.ox / st.w);
    const moved = st.x - d.ox;
    const far = Math.abs(moved) > st.w * PAGER_SNAP.ratio;
    const fast = Math.abs(d.vx) > PAGER_SNAP.velocity;
    let next = from;
    if (far || fast) next = from + (moved < 0 ? 1 : -1);
    next = Math.min(tabs.length - 1, Math.max(0, next));
    st.v = Math.max(-4000, Math.min(4000, d.vx));
    st.target = -next * st.w;
    run();
    if (tabs[next] !== active && onChange) onChange(tabs[next]);
  };

  return (
    <div ref={hostRef} className="absolute inset-0 overflow-hidden" style={{ contain: "layout paint" }}>
      <div ref={trackRef} className="flex h-full" aria-live="polite"
        style={{ width: `${tabs.length * 100}%`, willChange: "transform", transform: "translate3d(0,0,0)", touchAction: "pan-y" }}
        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}>
        {tabs.map((id, i) => (
          <div key={id} data-pager-panel={id} data-screen-label={id} aria-hidden={id !== active}
            className="relative h-full flex-none overflow-hidden" style={{ width: `${100 / tabs.length}%` }}>
            {children(id, i)}
          </div>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { TabPager, TabPagerBus, PAGER_SPRING, PAGER_SNAP });

</script>

function SignupScreen() {

  const [errors, setErrors] = uS({});
  const validate = () => {
    const next = {};
    if (id.trim().length < 4) next.id = "아이디는 4자 이상 입력해주세요.";
    if (pw.length < 8) next.pw = "비밀번호는 8자 이상 입력해주세요.";

/* 회원가입 본인 인증 — 이메일/휴대폰 중 선택, 6자리 코드, 재전송 타이머 */
function SignupVerifyScreen({ email, phone, onBack, onDone }) {
  const [channel, setChannel] = uS("phone");
  const [sent, setSent] = uS(false);
  const [code, setCode] = uS("");
  const [left, setLeft] = uS(0);
  const [error, setError] = uS(null);
  uE(() => { if (left <= 0) return; const t = setTimeout(() => setLeft(l => l - 1), 1000); return () => clearTimeout(t); }, [left]);
  const target = channel === "phone" ? (formatPhone(phone) || "010-0000-0000") : (email || "you@example.com");
  const send = () => { setSent(true); setLeft(180); setError(null); };
  const submit = () => { if (code.length !== 6) { setError("인증번호 6자리를 입력해주세요."); return; } onDone(); };
  const mmss = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
  return (
    <div className="flex h-full flex-col bg-canvas">
      <TopHeader variant="back" title="본인 인증" onBack={onBack} />
      <div className="no-scrollbar flex flex-1 flex-col overflow-y-auto px-6 pb-8 pt-[110px]">

        <div className="mt-6 flex gap-2">
          {[["phone", "휴대폰"], ["email", "이메일"]].map(([k, label]) => (
            <button key={k} onClick={() => { setChannel(k); setSent(false); setCode(""); setError(null); }} className={`h-11 flex-1 rounded-xl border text-[14px] font-semibold transition-colors ${channel === k ? "border-brand bg-brand-tint text-brand" : "border-hairline bg-surface text-ink-2"}`}>{label} 인증</button>
          ))}
        </div>
        <div className="mt-3 flex items-center gap-2 rounded-xl border border-hairline bg-surface px-4" style={{ height: 52 }}>
          <I name={channel === "phone" ? "phone" : "mail"} size={18} color="#64748b" />
          <span className="min-w-0 flex-1 truncate text-[15px] font-medium text-ink">{target}</span>
          <button onClick={send} className="shrink-0 text-[13px] font-semibold text-brand active:scale-95">{sent ? "재전송" : "인증번호 받기"}</button>
        </div>

          <div className="mt-3 rise-in">
            <div className="relative">
              <AuthField icon={<I name="shield-check" size={18} />} placeholder="인증번호 6자리" value={code} onChange={v => { setCode(v.replace(/[^\d]/g, "").slice(0, 6)); setError(null); }} invalid={!!error} />
              <span className="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-[13px] font-semibold tabular-nums text-heart">{mmss}</span>
            </div>
            {error && <p className="mt-2 pl-1 text-[13px] font-medium text-heart rise-in">{error}</p>}
            {left === 0 && <p className="mt-2 pl-1 text-[13px] font-medium text-slate-muted">유효 시간이 지났어요. 재전송을 눌러주세요.</p>}
          </div>
        )}
        <div className="mt-auto pt-8">
          <PrimaryButton disabled={!sent || code.length !== 6} onClick={submit}>인증 완료</PrimaryButton>
        </div>
      </div>
    </div>
  );
}

}

/* ── 매장 이름 검색 → 자동완성 → 지도 → 바텀시트 선택 ──
   상태별 노출: idle(검색바) · typing(드롭다운) · preview(지도+바텀시트) · picked(선택 카드)
   등장 모션은 위에서 아래로 순차 슬라이드다운(.drop-in) */
function StoreSearchField({ value, onPick, onClear, label = "매장 이름", demoPreview }) {
  const [query, setQuery] = uS(demoPreview ? demoPreview.name : "");
  const [preview, setPreview] = uS(demoPreview || null);
  const results = uM(() => {
    const q = query.trim();
    if (!q) return [];
    return REALS.STORE_DB.filter(a => a.name.includes(q) || a.road.includes(q) || a.jibun.includes(q)).slice(0, 5);
  }, [query]);

  if (value) {
    return (
      <div>
        <span className="mb-1.5 block pl-1 text-[12px] font-medium text-slate-muted">{label}</span>
        <div className="overflow-hidden rounded-2xl border border-brand-border bg-brand-tint fade-in">
          <div className="flex items-start gap-3 px-4 py-3.5">
            <div className="min-w-0 flex-1">
              <p className="truncate text-[15px] font-bold text-ink">{value.name}</p>
              <p className="mt-0.5 truncate text-[12px] text-ink-3">{value.road}</p>
              <p className="truncate text-[12px] text-slate-muted">지번 {value.jibun} · {formatPhone(value.phone)}</p>
            </div>
            <button onClick={() => { setQuery(""); onClear(); }} aria-label="매장 다시 검색" className="shrink-0 text-[13px] font-semibold text-brand active:scale-95">변경</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <span className="mb-1.5 block pl-1 text-[12px] font-medium text-slate-muted">{label}</span>
      {/* Search Bar */}
      <div className="flex items-center gap-2.5 rounded-xl border border-hairline bg-surface px-4" style={{ height: 52 }}>
        <I name="search" size={18} color="#64748b" />
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="매장 이름을 검색해 주세요" aria-label="매장 이름 검색" className="h-full flex-1 bg-transparent text-[15px] font-medium text-ink outline-none placeholder:text-slate-muted" />
        {query && <button onClick={() => setQuery("")} aria-label="검색어 지우기" className="active:scale-90"><I name="x" size={17} color="#64748b" /></button>}
      </div>
      {/* Autocomplete Dropdown List */}
      {results.length > 0 && (
        <ul className="mt-2 overflow-hidden rounded-xl border border-hairline bg-panel">
          {results.map((r, i) => (
            <li key={r.id} className="drop-in" style={{ animationDelay: `${0.04 + i * 0.06}s` }}>
              <button onClick={() => setPreview(r)} className="flex w-full items-center gap-3 border-b border-hairline/60 px-4 py-3 text-left last:border-b-0 active:bg-surface">
                <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand-tint"><I name="store" size={16} color="#2563eb" /></span>
                <span className="min-w-0 flex-1">
                  <span className="block truncate text-[14px] font-semibold text-ink">{r.name}</span>
                  <span className="block truncate text-[12px] text-slate-muted">{r.road}</span>
                </span>
              </button>
            </li>
          ))}
        </ul>
      )}
      {query.trim() && results.length === 0 && (
        <p className="mt-2 pl-1 text-[13px] font-medium text-slate-muted drop-in">검색 결과가 없어요. 매장 이름을 다시 확인해 주세요.</p>
      )}
      {/* Map View + Bottom Sheet / Info Card */}
      {preview && (
        <React.Fragment>
          <div onClick={() => setPreview(null)} className="absolute inset-0 z-40 bg-[rgba(15,23,42,0.45)] fade-in" />
          <div className="absolute inset-x-0 bottom-0 z-50 overflow-hidden rounded-t-[28px] bg-canvas sheet-in">
            <StoreMapView store={preview} />
            <div className="px-6 pb-8 pt-5">
              <div className="drop-in" style={{ animationDelay: ".06s" }}>
                <h3 className="text-[19px] font-bold tracking-tighter-title text-ink">{preview.name}</h3>
                <span className="mt-1 inline-flex items-center rounded-full bg-surface px-2 py-0.5 text-[11px] font-semibold text-slate-muted">{preview.category}</span>
              </div>
              <div className="mt-4 flex flex-col gap-2.5">
                <div className="flex items-start gap-2.5 drop-in" style={{ animationDelay: ".12s" }}>
                  <I name="map-pin" size={17} color="#2563eb" className="mt-0.5 shrink-0" />
                  <div className="min-w-0"><p className="text-[14px] font-semibold text-ink">{preview.road}</p><p className="text-[12px] text-slate-muted">지번 {preview.jibun}</p></div>
                </div>
                <div className="flex items-center gap-2.5 drop-in" style={{ animationDelay: ".18s" }}>
                  <I name="phone" size={17} color="#2563eb" className="shrink-0" />
                  <p className="text-[14px] font-medium text-ink-2">{formatPhone(preview.phone)}</p>
                </div>
              </div>
              <div className="mt-6 flex gap-2.5 drop-in" style={{ animationDelay: ".24s" }}>
                <button onClick={() => setPreview(null)} className="h-[52px] flex-1 rounded-xl border border-hairline bg-canvas text-[15px] font-semibold text-ink-2 active:scale-95 transition-transform">다시 검색</button>
                <button onClick={() => { onPick(preview); setPreview(null); setQuery(""); }} className="h-[52px] flex-[1.6] rounded-xl bg-brand text-[15px] font-semibold text-white active:scale-95 transition-transform">이 매장으로 선택</button>
              </div>
            </div>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ── 메뉴 정보 — 등록한 메뉴는 AI 추천 탭의 메뉴 드롭다운으로 그대로 쓰인다 ── */
function MenuEditor({ menus, onChange, label = "메뉴 정보" }) {
  const [name, setName] = uS(""); const [price, setPrice] = uS("");
  const add = () => {
    const n = name.trim(); if (!n) return;
    const p = price.replace(/[^d]/g, "");
    onChange([...menus, { id: `m_${Date.now()}`, name: n, price: p ? +p : null }]);
    setName(""); setPrice("");
  };
  return (
    <div>
      <span className="mb-1.5 flex items-baseline justify-between pl-1 text-[12px] font-medium text-slate-muted">
        <span>{label}</span><span className="text-[11px]">{menus.length}개 등록됨</span>
      </span>
      {menus.length > 0 && (
        <ul className="mb-2.5 flex flex-col gap-2">
          {menus.map(m => (
            <li key={m.id} className="flex items-center gap-3 rounded-xl border border-hairline bg-panel px-4 rise-in" style={{ height: 52 }}>
              <span className="min-w-0 flex-1 truncate text-[15px] font-medium text-ink">{m.name}</span>
              <span className="shrink-0 text-[14px] font-semibold tabular-nums text-ink-3">{m.price ? m.price.toLocaleString() + "원" : "가격 미정"}</span>
              <button onClick={() => onChange(menus.filter(x => x.id !== m.id))} aria-label={`${m.name} 삭제`} className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-surface text-slate-muted active:scale-90"><I name="x" size={15} /></button>
            </li>
          ))}
        </ul>
      )}
      <div className="flex gap-2">
        <input value={name} onChange={e => setName(e.target.value)} placeholder="메뉴 이름" aria-label="메뉴 이름" className="min-w-0 flex-[1.5] rounded-xl border border-hairline bg-surface px-4 text-[15px] font-medium text-ink outline-none placeholder:text-slate-muted focus:border-brand-border" style={{ height: 52 }} />
        <input value={price} onChange={e => setPrice(e.target.value)} inputMode="numeric" placeholder="가격" aria-label="메뉴 가격" className="min-w-0 flex-1 rounded-xl border border-hairline bg-surface px-4 text-[15px] font-medium tabular-nums text-ink outline-none placeholder:text-slate-muted focus:border-brand-border" style={{ height: 52 }} />
        <button onClick={add} disabled={!name.trim()} aria-label="메뉴 추가" className="flex w-[52px] shrink-0 items-center justify-center rounded-xl bg-brand text-white disabled:bg-track active:scale-95 transition-transform" style={{ height: 52 }}><I name="plus" size={20} color="#fff" /></button>
      </div>
    </div>
  );
}

/* ── 메뉴 사진 그리드 — 매장 선택 시 등록된 사진을 자동으로 불러오고, 삭제·추가할 수 있다 ──
   카드: 1:1 썸네일 · 우상단 삭제(X) · 좌하단 그라디언트 + 메뉴명 인풋 · 마지막 슬롯은 추가 카드 */
const IMGP = p => (window.__img ? window.__img(p) : p);
const AUTO_MENU_PHOTOS = [
  { name: "딸기 크림 라떼", src: null },
  { name: "크로플", src: null },
  { name: "시그니처 디저트", src: null },
  { name: "핸드드립 커피", src: null },
  { name: "치즈김밥", src: null }
];
function MenuPhotoGrid({ items, onChange, loading }) {
  const fileRef = React.useRef(null);
  const pick = e => {
    const files = Array.from(e.target.files || []);
    if (files.length) onChange([...items, ...files.map((f, i) => ({ id: `m_${Date.now()}_${i}`, name: "", price: null, image: URL.createObjectURL(f) }))]);
    e.target.value = "";
  };
  const rename = (id, name) => onChange(items.map(m => m.id === id ? { ...m, name } : m));
  return (
    <div>
      <span className="mb-1.5 flex items-baseline justify-between pl-1 text-[12px] font-medium text-slate-muted">
        <span>메뉴 사진</span>
        <span className="text-[11px]">{loading ? "불러오는 중…" : `${items.length}개 등록됨`}</span>
      </span>
      <input ref={fileRef} type="file" accept="image/*" multiple onChange={pick} className="hidden" aria-hidden="true" />
      <div className="grid grid-cols-3 gap-2">
        {loading && [0, 1, 2].map(i => <div key={i} className="skeleton aspect-square rounded-xl" />)}
        {!loading && items.map((m, i) => (
          <div key={m.id} className="relative aspect-square overflow-hidden rounded-xl bg-slate-200 drop-in" style={{ animationDelay: `${0.04 + i * 0.06}s` }}>
            {m.image ? <img src={m.image} alt={m.name || "메뉴 사진"} className="h-full w-full object-cover" /> : <span aria-hidden="true" className="absolute inset-0 bg-hairline" />}
            <span className="pointer-events-none absolute inset-x-0 bottom-0 h-[52%] bg-gradient-to-t from-black/75 via-black/25 to-transparent" />
            <button onClick={() => onChange(items.filter(x => x.id !== m.id))} aria-label={`${m.name || "메뉴"} 사진 삭제`}
              className="absolute right-1 top-1 flex h-7 w-7 items-center justify-center rounded-full bg-black/55 text-white backdrop-blur-sm active:scale-90 transition-transform">
              <I name="x" size={14} color="#fff" />
            </button>
            <input value={m.name} onChange={e => rename(m.id, e.target.value)} placeholder="메뉴명" aria-label="메뉴 이름"
              className="absolute inset-x-0 bottom-0 w-full bg-transparent px-2 pb-1.5 text-[12px] font-semibold text-white outline-none placeholder:text-white/60" />
          </div>
        ))}
        {!loading && (
          <button onClick={() => fileRef.current && fileRef.current.click()} aria-label="메뉴 사진 추가"
            className="flex aspect-square flex-col items-center justify-center gap-1 rounded-xl border-2 border-dashed border-slate-300 bg-slate-100 text-slate-500 active:scale-95 transition-transform">
            <I name="plus" size={22} />
            <span className="text-[12px] font-semibold">추가</span>
          </button>
        )}
      </div>
    </div>
  );
}

/* 선택한 매장 — 이름 · 지도 핀 · 자동으로 채워진 정보 */
function StorePickedDetail({ store, onChange }) {
  return (
    <div className="flex flex-col gap-5">
      <div>
        <span className="mb-1.5 flex items-baseline justify-between pl-1 text-[12px] font-medium text-slate-muted">
          <span>매장 이름</span>
          <button onClick={onChange} className="text-[12px] font-semibold text-brand active:scale-95">변경</button>
        </span>
        <div className="flex items-center rounded-xl border border-brand-border bg-brand-tint px-4" style={{ height: 52 }}>
          <p className="truncate text-[15px] font-bold text-ink">{store.name}</p>
        </div>
      </div>
      <div className="overflow-hidden rounded-2xl border border-hairline drop-in">
        <StoreMapView store={store} />
      </div>
      <div className="flex flex-col gap-3.5 drop-in" style={{ animationDelay: ".08s" }}>
        <div>
          <span className="mb-1.5 block pl-1 text-[12px] font-medium text-slate-muted">도로명 주소</span>
          <div className="flex items-center rounded-xl border border-hairline bg-surface px-4" style={{ height: 52 }}>
            <p className="truncate text-[15px] font-medium text-ink">{store.road}</p>
          </div>
        </div>
        <div>
          <span className="mb-1.5 block pl-1 text-[12px] font-medium text-slate-muted">지번 주소</span>
          <div className="flex items-center rounded-xl border border-hairline bg-surface px-4" style={{ height: 52 }}>
            <p className="truncate text-[15px] font-medium text-ink">{store.jibun}</p>
          </div>
        </div>
        <div>
          <span className="mb-1.5 block pl-1 text-[12px] font-medium text-slate-muted">전화번호</span>
          <div className="flex items-center rounded-xl border border-hairline bg-surface px-4" style={{ height: 52 }}>
            <p className="truncate text-[15px] font-medium tabular-nums text-ink">{formatPhone(store.phone)}</p>
          </div>
        </div>
      </div>
    </div>
  );
}

function StoreSyncScreen({ demoPreview, demoStep }) {
  const { navigate, updateStore } = useApp();
  const [step, setStep] = uS(demoStep || 1);
  const [picked, setPicked] = uS(demoPreview || null);
  const [category, setCategory] = uS(""); const [customCategory, setCustomCategory] = uS("");
  const [menus, setMenus] = uS([]);
  const [loadingMenus, setLoadingMenus] = uS(false);
  const timers = uM(() => ({ list: [] }), []);
  const onPickStore = p => {
    setPicked(p);
    setCategory(SYNC_CATEGORIES.includes(p.category) ? p.category : "직접입력");
    if (!SYNC_CATEGORIES.includes(p.category)) setCustomCategory(p.category);
  };
  const clearStore = () => { setPicked(null); setMenus([]); };
  /* 2단계 진입 — 메뉴 정보가 순서대로 자동 입력된다 */
  const goStep2 = () => {
    setStep(2);
    if (menus.length) return;
    setLoadingMenus(true);
    timers.list.forEach(clearTimeout); timers.list = [];
    timers.list.push(setTimeout(() => setLoadingMenus(false), 520));
    AUTO_MENU_PHOTOS.forEach((m, i) => {
      timers.list.push(setTimeout(() => setMenus(prev => [...prev, { id: `auto_${i}`, name: m.name, price: null, image: m.src }]), 560 + i * 240));
    });
  };
  uE(() => () => timers.list.forEach(clearTimeout), []);
  uE(() => { if (demoStep === 2 && demoPreview) { setCategory(demoPreview.category); goStep2(); } }, []);
  const resolvedCategory = category === "직접입력" ? customCategory : category;
  const complete = picked && resolvedCategory.trim() && menus.length > 0;
  const submit = () => {
    updateStore({ name: picked.name, category: resolvedCategory, road: picked.road, jibun: picked.jibun, phone: picked.phone, menus });
    navigate("home");
  };
  return (
    <div className="flex h-full flex-col bg-canvas">
      <TopHeader variant="back" title="매장 정보 등록하기" onBack={() => (step === 2 ? setStep(1) : navigate("permissions"))} />
      {step === 1 ? (
        <div key="s1" className="no-scrollbar flex flex-1 flex-col overflow-y-auto px-6 pb-6 pt-[110px]">
          <h2 className="text-[22px] font-bold leading-tight tracking-tighter-title text-ink">매장 정보를 등록해 주세요</h2>
          <p className="mt-2 text-[14px] leading-relaxed text-slate-muted">매장 이름을 검색해 선택하면 주소와 전화번호가 자동으로 채워져요.</p>
          <div className="mt-6">
            {picked
              ? <StorePickedDetail store={picked} onChange={clearStore} />
              : <StoreSearchField value={null} onPick={onPickStore} onClear={clearStore} demoPreview={demoPreview} />}
          </div>
          <div className="mt-auto pt-8"><PrimaryButton disabled={!picked} onClick={goStep2}>다음</PrimaryButton></div>
        </div>
      ) : (
        <div key="s2" className="no-scrollbar flex flex-1 flex-col overflow-y-auto px-6 pb-6 pt-[110px] slide-in">
          <h2 className="text-[22px] font-bold leading-tight tracking-tighter-title text-ink">{picked.name}</h2>
          <p className="mt-2 text-[14px] leading-relaxed text-slate-muted">업종과 메뉴 정보를 자동으로 채웠어요. 필요한 부분만 고쳐 주세요.</p>
          <div className="mt-6 flex flex-col gap-5">
            <div>
              <span className="mb-1.5 block pl-1 text-[12px] font-medium text-slate-muted">업종 카테고리</span>
              <div className="flex flex-wrap gap-2">
                {SYNC_CATEGORIES.map(c => (
                  <button key={c} onClick={() => { setCategory(c); if (c !== "직접입력") setCustomCategory(""); }} className={`whitespace-nowrap rounded-full border px-4 py-2 text-[14px] font-semibold transition-colors ${category === c ? "border-brand bg-brand text-white" : "border-hairline bg-surface text-ink-2"}`}>{c}</button>
                ))}
              </div>
              {category === "직접입력" && (
                <input value={customCategory} onChange={e => setCustomCategory(e.target.value)} placeholder="업종을 직접 입력해 주세요" aria-label="업종 직접 입력" className="mt-2.5 w-full rounded-xl border border-hairline bg-surface px-4 text-[15px] font-medium text-ink outline-none placeholder:text-slate-muted focus:border-brand-border rise-in" style={{ height: 52 }} />
              )}
            </div>
            <MenuPhotoGrid items={menus} onChange={setMenus} loading={loadingMenus} />
          </div>
          <div className="mt-auto pt-8"><PrimaryButton disabled={!complete} onClick={submit}>매장 등록 완료</PrimaryButton></div>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { StoreSearchField, MenuEditor, MenuPhotoGrid, SYNC_CATEGORIES, SignupVerifyScreen, SplashScreen, AuthScreen, SignupScreen, AccountRecoveryScreen, PermissionsScreen, StoreSyncScreen, AuthField });

</script>

<script type="text/babel" data-presets="react">

const { useState: iS, useRef: iR, useEffect: iE } = React;

const INTRO_W = 393, INTRO_N = 4, INTRO_CONE = Math.tan(30 * Math.PI / 180);

const onAnim = (n, delay = 0) => ({ animation: `${n} 4.6s linear ${delay}s infinite` });

            <I name="search" size={18} color="#64748b" />

        <div className="relative mt-2 h-[236px]">

function IntroScreen() {
  const { navigate, markIntroSeen } = useApp();
  const [i, setI] = iS(0);
  const trackRef = iR(null);
  const idx = iR(0);
  const paint = (n, instant) => {
    const tr = trackRef.current; if (!tr) return;
    tr.style.transition = instant ? "none" : `transform var(--dur-view-spring) var(--spring-view)`;
    tr.style.transform = `translate3d(${-n * INTRO_W}px,0,0)`;
  };
  const go = n => { const v = Math.max(0, Math.min(INTRO_N - 1, n)); idx.current = v; setI(v); paint(v); };
  iE(() => { paint(0, true); }, []);
  const finish = () => { markIntroSeen(); navigate("auth"); };

  const onDown = e => {
    const tr = trackRef.current; if (!tr) return;
    const x0 = e.clientX, y0 = e.clientY, base = -idx.current * INTRO_W, min = -(INTRO_N - 1) * INTRO_W;
    let dir = null;
    tr.style.transition = "none";
    const mv = ev => {
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if (dir === null) { if (Math.abs(dx) + Math.abs(dy) < 6) return; dir = Math.abs(dy) > Math.abs(dx) * INTRO_CONE ? "v" : "h"; }
      if (dir !== "h") return;
      let x = base + dx;
      if (x > 0) x *= 0.35;
      if (x < min) x = min + (x - min) * 0.35;
      tr.style.transform = `translate3d(${x}px,0,0)`;
    };
    const up = ev => {
      window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up);
      if (dir !== "h") { paint(idx.current); return; }
      const dx = ev.clientX - x0;
      go(dx < -INTRO_W * 0.25 ? idx.current + 1 : dx > INTRO_W * 0.25 ? idx.current - 1 : idx.current);
    };
    window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
  };

  const last = i === INTRO_N - 1;
  return (
    <div className="relative h-full bg-canvas">
      <StatusBar />
      <div className="flex h-11 items-center justify-end px-5">
        <button onClick={finish} style={{ opacity: last ? 0 : 1, pointerEvents: last ? "none" : "auto" }} className="h-8 px-2.5 text-[14px] font-semibold tracking-[-.01em] text-track transition-opacity">건너뛰기</button>
      </div>
      <div onPointerDown={onDown} className="absolute inset-x-0 bottom-0 top-[98px] overflow-hidden" style={{ touchAction: "pan-y" }}>
        <div ref={trackRef} className="flex h-full" style={{ width: INTRO_W * INTRO_N, willChange: "transform" }}>
          {INTRO_SLIDES.map((s, n) => (
            <section key={s.label} data-screen-label={s.label} className="flex h-full flex-none flex-col px-[34px]" style={{ width: INTRO_W }}>
              <div className="flex min-h-0 flex-1 items-center justify-center pt-2"><s.Art /></div>
              <div className="flex-none pb-[142px] pt-5"><IntroHeading head={s.head} sub={s.sub} /></div>
            </section>
          ))}
        </div>
      </div>
      <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-white via-white/95 to-transparent px-[34px] pb-[34px] pt-8">
        <div className="flex h-9 items-center gap-1.5">
          {INTRO_SLIDES.map((s, n) => (
            <button key={s.label} onClick={() => go(n)} aria-label={`${n + 1}단계`} className="h-1.5 rounded-full p-0 transition-all duration-300"
              style={{ width: n === i ? 20 : 6, backgroundColor: n === i ? "#2563eb" : "#cbd5e1" }} />
          ))}
        </div>
        <button onClick={() => last ? finish() : go(i + 1)} className="mt-3 h-14 w-full rounded-full bg-ink text-[16.5px] font-bold tracking-[-.01em] text-white active:scale-[0.97] transition-transform">
          {last ? "무료로 시작하기" : "다음"}
        </button>
      </div>
    </div>
  );
}

<script type="text/babel" data-presets="react">
/* Tab screens: Home (feed + pull-to-refresh), Saved (grid + select mode). Chat 은 screens-chat.jsx */
const { useState: tS, useEffect: tE, useRef: tR, useMemo: tM } = React;

function HomeScreen() {
  const { navigate } = useApp();
  const scrollRef = tR(null); const startY = tR(0); const pulling = tR(false);
  const [pullY, setPullY] = tS(0); const [refreshing, setRefreshing] = tS(false);
  /* loading → ready. 오류/빈 상태는 같은 컴포넌트가 처리하며, 리뷰는 설정 → 상태·오류 화면 */
  const [feed, setFeed] = tS("loading");
  tE(() => { const t = setTimeout(() => setFeed("ready"), 700); return () => clearTimeout(t); }, []);
  const onTouchStart = e => { if (refreshing) return; if ((scrollRef.current?.scrollTop ?? 0) <= 0) { startY.current = e.touches[0].clientY; pulling.current = true; } };
  const onTouchMove = e => { if (!pulling.current || refreshing) return; const dy = e.touches[0].clientY - startY.current; setPullY(dy > 0 ? Math.min(dy * 0.5, 90) : 0); };
  const onTouchEnd = () => {
    if (!pulling.current) return; pulling.current = false;
    if (pullY >= 60) { setRefreshing(true); setPullY(60); setTimeout(() => { setRefreshing(false); setPullY(0); }, 1200); } else setPullY(0);
  };
  const show = pullY > 4 || refreshing;
  if (feed !== "ready") return (
    <div className="relative h-full overflow-hidden bg-canvas">
      <HomeHeader />
      {feed === "loading" && <FeedSkeleton />}
      {feed === "error" && <FeedError onRetry={() => { setFeed("loading"); setTimeout(() => setFeed("ready"), 700); }} />}
      {feed === "empty" && <FeedEmpty onEdit={() => navigate("edit-profile")} />}
    </div>
  );
  return (
    <div className="relative h-full bg-canvas">
      <HomeHeader />
      <div className="pointer-events-none absolute inset-x-0 top-[106px] z-20 flex justify-center">
        <div className="flex h-10 w-10 items-center justify-center rounded-full border border-hairline bg-canvas shadow-md transition-all" style={{ transform: `translateY(${show ? 0 : -50}px)`, opacity: show ? 1 : 0 }}>
          <span className="flex items-center justify-center" style={{ transform: `rotate(${refreshing ? 0 : (pullY / 90) * 180}deg)`, animation: refreshing ? "spin-linear .8s linear infinite" : "none" }}>
            <I name="rotate-ccw" size={18} color={refreshing ? "#D93E12" : "#6B7280"} />
          </span>
        </div>
      </div>
      <div ref={scrollRef} onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} className="no-scrollbar h-full snap-y snap-mandatory overflow-y-auto overscroll-contain">
        <div style={{ transform: `translateY(${pullY}px)`, transition: pulling.current ? "none" : "transform .3s cubic-bezier(.16,1,.3,1)" }}>
          {REALS.REELS.map(reel => <ReelCard key={reel.id} reel={reel} />)}
        </div>
      </div>
    </div>
  );
}

function GridTile({ selectMode, selected, onTap, image }) {
  return (
    <button onClick={onTap} aria-label={selectMode ? (selected ? "선택 해제" : "선택") : "촬영 시작"} className="relative aspect-[3/4] overflow-hidden rounded-[2px] pop-in">
      {image ? <img src={image} alt="" className="absolute inset-0 h-full w-full object-cover" /> : <span className="absolute inset-0 bg-hairline" />}
      {selectMode && <span className={`pointer-events-none absolute inset-0 rounded-[2px] transition-all ${selected ? "ring-[3px] ring-inset ring-brand" : "ring-1 ring-inset ring-hairline"}`} />}
    </button>

}
function SavedScreen() {
  const { saved, toggleSave, startShoot } = useApp();
  const [selectMode, setSelectMode] = tS(false); const [selected, setSelected] = tS([]);
  const grid = tM(() => REALS.REELS.filter(r => saved.includes(r.id)), [saved]);
  const toggleSelect = id => setSelected(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
  const exitSelect = () => { setSelectMode(false); setSelected([]); };
  const removeSelected = () => { selected.forEach(id => { if (saved.includes(id)) toggleSave(id); }); exitSelect(); };
  return (
    <div className="relative h-full bg-canvas">
      <header className="absolute inset-x-0 top-0 z-30 border-b border-hairline/60 bg-canvas/95 backdrop-blur-md">
        <StatusBar />
        <div className="flex h-11 items-center px-4">
          <span className="absolute left-1/2 -translate-x-1/2 text-[18px] font-bold tracking-tighter-title text-ink">관심 목록</span>
          {grid.length > 0 && <button onClick={() => (selectMode ? exitSelect() : setSelectMode(true))} className="ml-auto text-[15px] font-semibold text-brand active:scale-95">{selectMode ? "완료" : "선택"}</button>}
        </div>
      </header>
      <div className="no-scrollbar h-full overflow-y-auto pt-[104px]">
        {grid.length === 0 ? (
          <div className="flex flex-col items-center gap-4 px-6 pt-24 text-center">
            <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-tint"><HeartGlyph size={26} stroke="#2563eb" strokeWidth={1.75} /></div>
            <p className="text-[15px] font-medium leading-relaxed text-slate-muted">아직 담은 콘텐츠가 없어요.<br />홈에서 마음에 드는 숏폼에 좋아요를 눌러보세요.</p>
          </div>
        ) : (
          <div className="grid grid-cols-3 gap-[3px] px-[3px] pb-28 pt-[3px]">
            {grid.map(item => <GridTile key={item.id} image={item.image} selectMode={selectMode} selected={selected.includes(item.id)} onTap={() => (selectMode ? toggleSelect(item.id) : startShoot(item.id))} />)}
          </div>
        )}
      </div>
      {selectMode && selected.length > 0 && (
        <div className="absolute inset-x-0 bottom-[83px] z-40 border-t border-hairline bg-canvas/95 px-5 pb-3 pt-3 text-center backdrop-blur-md rise-in">
          <button onClick={removeSelected} className="w-full py-2 text-[16px] font-bold text-heart active:scale-[0.98]">좋아요 취소({selected.length}개)</button>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { HomeScreen, SavedScreen, GridTile });

</script>

<script type="text/babel" data-presets="react">
/* AI 숏폼 추천 탭 — v1.1 사전 컨텍스트 규칙을 그대로 구현한 분기 대화.
   · 최상위 진입 2개 · 6개 홍보 카테고리 · 필수 4값 확정 · Store Context 충돌 확인
   · SAVE_AND_ASK / CLARIFY / SUGGEST_SWITCH / RESOLVE_CONFLICT / CONFIRM / RECOMMEND */
const { useState: cS, useEffect: cE, useRef: cR, useMemo: cM } = React;

const ROOT_Q = "오늘 어떤 영상을 찍을까요?";
const CHIP = "inline-flex items-center whitespace-nowrap rounded-full border border-brand-border bg-canvas px-4 py-2.5 text-[14px] font-semibold text-brand active:scale-95 transition-transform rise-in";
const CHIP_MUTED = "inline-flex items-center whitespace-nowrap rounded-full border border-hairline bg-canvas px-4 py-2.5 text-[14px] font-semibold text-ink-2 active:scale-95 transition-transform rise-in";
const FIELD_LABEL = { subject: "홍보 내용", objective: "홍보 목적", time: "촬영 가능 시간", face: "얼굴 노출" };

function Bubble({ children }) {
  return (
    <div className="flex items-start gap-2 rise-in">
      <div className="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand"><I name="sparkles" size={16} color="#fff" /></div>
      <div className="max-w-[80%] whitespace-pre-line rounded-2xl rounded-tl-md bg-panel px-3.5 py-2.5 text-[15px] font-medium leading-snug text-ink-2 shadow-[0_2px_10px_-2px_rgba(15,23,42,0.06)]">{children}</div>
    </div>
  );
}
/* 숏츠 임베딩 — 9:16 플레이어 슬롯 */
function ShortsEmbed({ poster }) {
  return (
    <div className="flex justify-center">
      <div className="relative h-[280px] w-[158px] overflow-hidden rounded-lg bg-hairline">
        {poster && <img src={poster} alt="" className="absolute inset-0 h-full w-full object-cover" />}
        <span className="absolute inset-0 flex items-center justify-center">
        </span>
      </div>
    </div>
  );
}
/* 카드 구성: 제목 · AI 한줄요약 · 해시태그 3개 · 숏츠 임베딩 · 바로 촬영하기 — 위아래 여백은 gap-3 로 통일 */
function RecoCard({ rec, poster, onShoot }) {
  return (
    <div className="flex h-full flex-col gap-3 rounded-2xl border border-brand-border bg-canvas p-4">
      <h3 className="text-[15px] font-bold leading-snug tracking-tighter-title text-ink" style={{ color: "#0F172A" }}>{rec.title}</h3>
      <p className="text-[12px] font-semibold leading-relaxed text-brand" style={{ color: "#0F172AB7" }}>{rec.tags.slice(0, 3).join(" ")}</p>
      <ShortsEmbed poster={poster} />
      <button onClick={onShoot} className="mt-auto flex h-11 items-center justify-center gap-1.5 rounded-xl bg-brand text-[14px] font-semibold text-white active:scale-95 transition-transform">이 숏폼으로 선택하기</button>
    </div>
  );
}

/* 등록된 메뉴 드롭다운 — 선택이 기본, 직접 입력은 보조. 직접 입력한 메뉴는 목록에 추가하지 않는다. */
function MenuPicker({ menus, onPick, onManual }) {
  const [open, setOpen] = cS(true);
  return (
    <div className="w-full">
      <button onClick={() => setOpen(o => !o)} className="flex h-12 w-full items-center justify-between rounded-xl border border-brand-border bg-canvas px-4 text-[14px] font-semibold text-brand active:scale-[0.98] transition-transform">
        <span>등록된 메뉴에서 선택</span><I name={open ? "chevron-up" : "chevron-down"} size={18} />
      </button>
      {open && (
        <ul className="mt-2 overflow-hidden rounded-xl border border-hairline bg-canvas">
          {menus.map((m, i) => (
            <li key={m.id} className="drop-in" style={{ animationDelay: `${0.03 + i * 0.05}s` }}>
              <button onClick={() => onPick(m)} className="flex w-full items-center justify-between gap-3 border-b border-hairline/60 px-4 py-3 text-left last:border-b-0 active:bg-surface">
                <span className="min-w-0 flex-1 truncate text-[14px] font-medium text-ink">{m.name}</span>
                <span className="shrink-0 text-[13px] font-semibold tabular-nums text-slate-muted">{m.price ? m.price.toLocaleString() + "원" : "가격 미정"}</span>
              </button>
            </li>
          ))}
          {menus.length === 0 && <li className="px-4 py-3 text-[13px] text-slate-muted">등록된 메뉴가 없어요. 직접 입력해 주세요.</li>}
        </ul>
      )}
      <button onClick={onManual} className={`${CHIP_MUTED} mt-2`}>메뉴 직접 입력</button>
    </div>
  );
}

/* 화면을 떠나도 대화가 남도록 모듈 스코프에 보관 (촬영 플로우 → 뒤로가기 복귀용) */
const CHAT_CACHE = { msgs: null, nodeId: "root", st: {}, interject: null, input: "", scroll: 0 };
window.resetChatCache = () => { CHAT_CACHE.msgs = null; CHAT_CACHE.nodeId = "root"; CHAT_CACHE.st = {}; CHAT_CACHE.interject = null; CHAT_CACHE.input = ""; CHAT_CACHE.scroll = 0; };

function ChatScreen({ demoMsgs }) {
  const { startShoot, chatPrefill, consumeChatPrefill, store } = useApp();
  const flow = cM(() => REALS.buildRecoFlow(store.category), [store.category]);
  const menus = store.menus; /* 매장 등록·매장 정보 수정에서 등록한 메뉴 */
  const restored = cR(CHAT_CACHE.msgs !== null);
  const [msgs, setMsgs] = cS(() => demoMsgs || window.__chatDemo || CHAT_CACHE.msgs || [{ k: "ai", text: ROOT_Q }]);
  const [nodeId, setNodeId] = cS(CHAT_CACHE.nodeId);
  const [st, setSt] = cS(CHAT_CACHE.st);
  const [typing, setTyping] = cS(false);
  const [interject, setInterject] = cS(CHAT_CACHE.interject);
  const [input, setInput] = cS(CHAT_CACHE.input);
  const [freeMode, setFreeMode] = cS(false); /* 객관식이 기본 — 직접 입력은 사용자가 열었을 때만 */
  cE(() => { if (demoMsgs) return; CHAT_CACHE.msgs = msgs; CHAT_CACHE.nodeId = nodeId; CHAT_CACHE.st = st; CHAT_CACHE.interject = interject; CHAT_CACHE.input = input; }, [msgs, nodeId, st, interject, input]);
  const stRef = cR(st); cE(() => { stRef.current = st; }, [st]);
  const scrollRef = cR(null);
  const node = nodeId ? flow[nodeId] : null;
  cE(() => {
    const el = scrollRef.current; if (!el) return;
    if (restored.current) { restored.current = false; el.scrollTop = CHAT_CACHE.scroll || el.scrollHeight; return; } // 복귀 시 마지막으로 보던 위치
    el.scrollTo({ top: el.scrollHeight, behavior: "smooth" });
  }, [msgs, typing, interject]);
  cE(() => () => { if (scrollRef.current) CHAT_CACHE.scroll = scrollRef.current.scrollTop; }, []); // 화면 이탈 시 스크롤 위치 저장

  const reset = () => { window.resetChatCache(); setMsgs([{ k: "ai", text: ROOT_Q }]); setNodeId("root"); setSt({}); setInterject(null); setInput(""); setTyping(false); setFreeMode(false); };
  const say = text => setMsgs(m => [...m, { k: "ai", text }]);
  const resolve = (id, state) => {
    if (id !== "need") return id;
    if (!state.subject) return state.category ? "cat" : "cat";
    if (!state.objective) return "askObjective";
    if (!state.time) return "askTime";
    if (!state.face) return "askFace";
    if (state.face === "얼굴 없이 촬영" && /사장님|직원|팀 소개/.test(state.kind || "") && !state.faceResolved) return "faceConflict";
    return "confirm";
  };
  const summaryLines = state => {
    const L = [];
    L.push(`홍보할 내용: ${state.subject || "미정"}${state.price ? ` · ${state.price}` : ""}${state.period ? ` · ${state.period}` : ""}`);
    L.push(`홍보 목적: ${state.objective}`);
    L.push(`촬영 가능 시간: ${state.time}`);
    L.push(`얼굴 노출: ${state.face}`);
    if (state.category) L.push(`카테고리: ${state.category}${state.kind ? ` · ${state.kind}` : ""}`);
    return L.join("\n");
  };
  /* 다음 노드로 이동 — patch 로 상태를 병합하고, 필요하면 지연 후 질문을 띄운다 */
  const go = (nextId, userText, patch) => {
    if (userText) setMsgs(m => [...m, { k: "user", text: userText }]);
    const state = { ...stRef.current, ...(patch || {}) };
    setSt(state); stRef.current = state;
    setNodeId(""); setInterject(null); setTyping(true); setFreeMode(false);
    setTimeout(() => {
      setTyping(false);
      const id = resolve(nextId, state);
      const nx = flow[id];
      if (!nx) return;
      if (nx.type === "confirm") setMsgs(m => [...m, { k: "ai", text: "이렇게 이해했어요\n\n" + summaryLines(state) }, { k: "ai", text: "이 내용으로 추천해 드릴까요?" }]);
      else if (nx.type === "result") setMsgs(m => [...m, { k: "ai", text: "실제로 오늘 찍을 수 있는 3가지를 추천해 드려요." }, { k: "recs", recs: REALS.buildRecommendations(state) }]);
      else setMsgs(m => [...m, { k: "ai", text: nx.question }]);
      setNodeId(id);
    }, 700);
  };
  const ask = (id, lead) => { setNodeId(""); setInterject(null); setTyping(true); setFreeMode(false); setTimeout(() => { setTyping(false); setMsgs(m => [...m, ...(lead ? [{ k: "ai", text: lead }] : []), { k: "ai", text: flow[id].question }]); setNodeId(id); }, 650); };

  cE(() => {
    if (!chatPrefill) return;
    setMsgs([{ k: "ai", text: ROOT_Q }, { k: "user", text: chatPrefill }]);
    setNodeId("free"); consumeChatPrefill();
    setTimeout(() => handleFree(chatPrefill, true), 60);
  }, [chatPrefill]);

  /* ── 자유 입력 처리 ── */
  const handleFree = (text, skipEcho) => {
    if (!skipEcho) setMsgs(m => [...m, { k: "user", text }]);
    const r = REALS.extractFields(text);
    const prev = stRef.current;
    if (r.reason === "off_topic") {
      setTyping(true);
      setTimeout(() => {
        setTyping(false);
        say("여기서는 매장 홍보용 숏폼 제작을 도와드릴 수 있어요.\n만들고 싶은 영상이나 홍보하고 싶은 내용을 알려주세요.");
        setInterject({ options: ["신메뉴를 홍보하고 싶어요", "매장 분위기를 보여주고 싶어요", "할인 이벤트 영상을 만들고 싶어요"].map(l => ({ label: l, act: () => handleFree(l) })) });
      }, 650);
      return;
    }
    if (r.reason === "photo_only") {
      setTyping(true);
      setTimeout(() => { setTyping(false); say("등록한 매장 사진은 분위기와 촬영 포인트를 참고하는 데 사용할 수 있어요.\n최종 영상은 실제 촬영한 영상 클립을 기준으로 만들 수 있도록 장면을 추천해 드릴게요."); ask("cat"); }, 650);
      return;
    }
    if (r.reason === "too_abstract") {
      setTyping(true);
      setTimeout(() => { setTyping(false); say("원하는 영상 느낌은 알겠어요.\n무엇을 가장 보여주고 싶은지 알려주세요."); setNodeId("cat"); setInterject(null); }, 650);
      return;
    }
    if (r.reason === "multi_subject") {
      setTyping(true);
      setTimeout(() => {
        setTyping(false);
        say("이번 영상에서 가장 중심으로 보여줄 내용 하나를 골라주세요. 나머지는 보조 정보로 넣거나 영상을 나눠 추천할 수 있어요.");
        setInterject({ options: r.multi.map(c => ({ label: c, act: () => { setMsgs(m => [...m, { k: "user", text: c }]); const patch = { ...r.fields, category: c, secondary: r.multi.filter(x => x !== c) }; delete patch.subject; setSt(s => ({ ...s, ...patch })); stRef.current = { ...stRef.current, ...patch }; ask(catEntry(c), null); } })) });
      }, 650);
      return;
    }
    if (r.conflicts.length) {
      const cf = r.conflicts[0];
      setTyping(true);
      setTimeout(() => {
        setTyping(false);
        say(`백엔드에서 불러온 ${cf.field}은 ${cf.stored}인데 이번 입력에서는 ${cf.input}이라고 하셨어요.\n어떤 값을 사용할까요?`);
        setInterject({
          options: [
            { label: `${cf.stored} 사용`, act: () => applyFree({ ...r.fields, price: cf.stored }, `${cf.stored} 사용`) },
            { label: `${cf.input} 사용`, act: () => applyFree({ ...r.fields, price: cf.input }, `${cf.input} 사용`) }
          ]
        });
      }, 650);
      return;
    }
    /* SUGGEST_SWITCH — 진행 중 카테고리와 다른 카테고리가 더 맞아 보일 때 */
    if (prev.category && r.fields.category && r.fields.category !== prev.category) {
      const to = r.fields.category;
      setTyping(true);
      setTimeout(() => {
        setTyping(false);
        say(`이 내용은 ${prev.category}보다 ${to}에 더 가까워 보여요. 어떻게 진행할까요?`);
        setInterject({
          options: [
            { label: `${to}로 변경`, act: () => { setMsgs(m => [...m, { k: "user", text: `${to}로 변경` }]); const patch = { category: to, subject: r.fields.subject || undefined }; setSt(s => ({ ...s, ...patch })); stRef.current = { ...stRef.current, ...patch }; ask(patch.subject ? "need" : catEntry(to)); } },
            { label: `${prev.category} 계속`, act: () => applyFree(r.fields, `${prev.category} 계속`) }
          ]
        });
      }, 650);
      return;
    }
    applyFree(r.fields);
  };
  const catEntry = label => ({ "메뉴": "menuKind", "매장 공간·분위기": "space", "이벤트·혜택·할인": "eventInput", "사람·브랜드 이야기": "story", "이용 정보": "usage", "후기·신뢰·전문성": "trust" })[label] || "cat";
  /* SAVE_AND_ASK — 받은 값은 저장하고 아직 없는 값만 다시 묻는다 */
  const applyFree = (fields, echo) => {
    if (echo) setMsgs(m => [...m, { k: "user", text: echo }]);
    const prev = stRef.current;
    const saved = Object.keys(fields).filter(k => FIELD_LABEL[k] && !prev[k] && fields[k]);
    const state = { ...prev, ...fields };
    setSt(state); stRef.current = state;
    const lead = saved.length ? saved.map(k => `${FIELD_LABEL[k]}은 ${fields[k]}(으)로 저장했어요.`).join("\n") : null;
    setNodeId(""); setInterject(null); setTyping(true);
    setTimeout(() => {
      setTyping(false);
      if (lead) say(lead);
      const id = resolve(state.subject ? "need" : "cat", state);
      const nx = flow[id];
      if (nx.type === "confirm") setMsgs(m => [...m, { k: "ai", text: "이렇게 이해했어요\n\n" + summaryLines(state) }, { k: "ai", text: "이 내용으로 추천해 드릴까요?" }]);
      else setMsgs(m => [...m, { k: "ai", text: nx.question }]);
      setNodeId(id);
    }, 650);
  };
  const send = () => {
    const text = input.trim(); if (!text) return;
    setInput("");
    if (node && (node.type === "input" || node.type === "menuPick" || node.type === "free")) {
      if (node.type === "free") { handleFree(text); return; }
      go(node.next, text, node.key ? { [node.key]: text } : null);
      return;
    }
    handleFree(text);
  };
  const editField = key => { setInterject(null); ask({ subject: "cat", objective: "askObjective", time: "askTime", face: "askFace" }[key]); setSt(s => ({ ...s, [key]: undefined })); stRef.current = { ...stRef.current, [key]: undefined }; };

  const composerOpen = true; /* 직접 입력칸은 항상 활성화 */
  const multiline = (node && node.type === "input" && node.multiline) || (node && node.type === "free");
  const placeholder = node && node.type === "input" ? node.placeholder : node && node.type === "free" ? "예: 딸기 크림 라떼 판매를 늘리고 싶고 얼굴 없이 10분 안에 찍고 싶어요" : "직접 입력해 보세요";
  return (
    <div className="relative h-full bg-surface">
      <TopHeader variant="title" title="AI 숏폼 추천" right={[{ icon: "rotate-ccw", label: "대화 새로고침", onClick: reset }]} />
      <div ref={scrollRef} className="no-scrollbar h-full overflow-y-auto px-5 pb-[176px] pt-[110px]">
        <div className="flex flex-col gap-3">
          {msgs.map((m, i) => m.k === "ai" ? <Bubble key={i}>{m.text}</Bubble> : m.k === "user" ? (
            <div key={i} className="flex justify-end rise-in"><div className="max-w-[80%] whitespace-pre-line rounded-2xl rounded-tr-md bg-brand px-3.5 py-2.5 text-[15px] font-medium leading-snug text-white">{m.text}</div></div>
          ) : (
            <div key={i} className="-mr-5 ml-10 rise-in">
              <div className="no-scrollbar flex snap-x snap-mandatory gap-3 overflow-x-auto pb-1 pr-5">
                {m.recs.map((rec, n) => (
                  <div key={rec.id} className="w-[248px] shrink-0 snap-start">
                    <RecoCard rec={rec} poster={rec.poster || REALS.REELS[n % REALS.REELS.length].image} onShoot={() => startShoot()} />
                  </div>
                ))}
              </div>
            </div>
          ))}
          {typing && (
            <div className="flex items-start gap-2">
              <div className="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand"><I name="sparkles" size={16} color="#fff" /></div>
              <div className="flex items-center gap-1 rounded-2xl rounded-tl-md bg-panel px-4 py-3.5 shadow-[0_2px_10px_-2px_rgba(15,23,42,0.06)]">
                {[0, 1, 2].map(d => <span key={d} className="h-2 w-2 rounded-full bg-slate-muted" style={{ animation: `typing-dot .9s ${d * 0.15}s infinite` }} />)}
              </div>
            </div>
          )}
          {!typing && interject && (
            <div className="ml-10 flex flex-wrap gap-2">
              {interject.options.map((o, i) => <button key={o.label} style={{ animationDelay: `${i * 0.06}s` }} onClick={o.act} className={CHIP}>{o.label}</button>)}
            </div>
          )}
          {!typing && !interject && node && node.type === "result" && (
            <div className="mt-1 flex justify-center">
              <button onClick={() => go("result", "다른 추천 보기")} className={CHIP_MUTED}>다른 추천 보기</button>
            </div>
          )}
          {!typing && !interject && node && node.type !== "result" && (
            <div className="ml-10 flex flex-wrap gap-2">
              {node.type === "choice" && node.free && <button onClick={() => ask(node.free)} className={`${CHIP_MUTED} order-last`}>직접 입력하기</button>}
              {node.type === "choice" && node.options.map((o, i) => <button key={o.label} style={{ animationDelay: `${i * 0.06}s` }} onClick={() => go(o.next, o.label, { ...(node.key ? { [node.key]: o.label } : {}), ...(o.setFace ? { face: o.setFace } : {}), ...(nodeId === "faceConflict" ? { faceResolved: true } : {}) })} className={CHIP}>{o.label}</button>)}
              {node.type === "chips" && node.chips.map((c, i) => <button key={c} style={{ animationDelay: `${i * 0.06}s` }} onClick={() => go(node.next, c, { [node.key]: c })} className={CHIP}>{c}</button>)}
              {node.type === "menuPick" && (
                <MenuPicker menus={menus} onManual={() => setFreeMode(true)}
                  onPick={mm => go(node.next, mm.price ? `${mm.name} · ${mm.price.toLocaleString()}원` : mm.name, { subject: mm.name, price: mm.price ? `${mm.price.toLocaleString()}원` : undefined })} />
              )}
              {node.type === "input" && (
                <div className="flex flex-wrap gap-2">
                  {(node.presets || []).map((p, i) => <button key={p} style={{ animationDelay: `${i * 0.06}s` }} onClick={() => go(node.next, p, node.key ? { [node.key]: p } : null)} className={CHIP}>{p}</button>)}
                  <button onClick={() => setFreeMode(true)} className={CHIP_MUTED}>직접 입력</button>

/* ── 테스크 슬라이더 ──

const SLIDE_W = 393;

  return `https://www.youtube.com/embed/${id}?start=${start}&end=${end}&autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&modestbranding=1&rel=0&playsinline=1`;

  const move = (dx, animate) => {
    const el = trackRef.current; if (!el) return;
    el.style.transition = animate ? "transform .42s cubic-bezier(.22,1,.36,1)" : "none";
    el.style.transform = `translate3d(${-idxRef.current * SLIDE_W + dx}px,0,0)`;

    move(over ? dx * 0.3 : dx, false);

function PipGuide({ width = 98, src }) {

    const move = ev => {

function EditingScreen() {
  const { navigate, activeReel, resetToTab, editDraft, editResume, consumeEditResume, clearEditDraft } = useApp();
  const [progress, setProgress] = sS(editResume && editDraft ? editDraft.progress : 0);
  sE(() => { if (editResume) consumeEditResume(); }, []);
  const [failed, setFailed] = sS(null); // null | "timeout" | "system"
  const [attempt, setAttempt] = sS(0);
  const [savedAt, setSavedAt] = sS("");
  const [failReason, setFailReason] = sS("");
  /* 대기 순번 — BE 가 주는 queue position. 동시성이 낮을 때 유일한 체감 개선책이라 진행 화면에 노출한다. */
  const QUEUE = { ahead: 3, minsPerJob: 1.5 };
  const ahead = Math.max(0, QUEUE.ahead - progress);
  const waitMins = Math.max(1, Math.round(ahead * QUEUE.minsPerJob));
  const STEPS = [{ id: "e1", label: "컷 편집" }, { id: "e5", label: "컷 사이 흔들림 효과 삽입" }, { id: "e2", label: "자막 입히기" }, { id: "e3", label: "위치 태그 · 매장 브랜딩 삽입" }, { id: "e4", label: "최종 렌더링" }];
  sE(() => {
    if (failed || progress >= STEPS.length) return;
    const t = setTimeout(() => setProgress(p => p + 1), 900);
    return () => clearTimeout(t);
  }, [progress, failed]);
  /* 15분 편집 세션 타임아웃 — 편집이 끝나기 전에 세션이 만료되면 마지막 자동 저장 시각을 안고 오류 화면으로 */
  const EDIT_SESSION_MS = 15 * 60 * 1000;
  const AUTOSAVE_MS = 5 * 60 * 1000;
  sE(() => {
    if (progress >= STEPS.length || failed) return;
    const startedAt = Date.now();
    const t = setTimeout(() => {
      const last = new Date(startedAt + Math.floor(EDIT_SESSION_MS / AUTOSAVE_MS) * AUTOSAVE_MS);
      setSavedAt(`${String(last.getHours()).padStart(2, "0")}:${String(last.getMinutes()).padStart(2, "0")}`);
      setFailReason("EDIT_SESSION_EXPIRED: 편집 세션이 15분을 초과했습니다");
      setFailed("timeout");
    }, EDIT_SESSION_MS);
    return () => clearTimeout(t);
  }, [attempt, progress >= STEPS.length, failed]);
  /* 렌더링 실패 화면은 실제 네트워크 단절에서만 뜬다 — 프로토타입에서는 수동 트리거가 없다.
     프로덕션에서는 아래 onOffline 대신 렌더 API 의 실패/타임아웃 응답도 같은 경로로 연결한다. */
  sE(() => {
    if (progress >= STEPS.length) return;
    const onOffline = () => { setFailReason("NETWORK_OFFLINE: 렌더 서버에 연결할 수 없습니다"); setFailed("system"); };
    if (typeof navigator !== "undefined" && navigator.onLine === false) onOffline();
    window.addEventListener("offline", onOffline);
    return () => window.removeEventListener("offline", onOffline);
  }, [progress, STEPS.length]);
  const done = progress >= STEPS.length;
  const { pushNotif } = useApp();
  const [toast, setToast] = sS(false);
  sE(() => { if (done) { pushNotif("사장님의 숏폼 편집이 완료되었어요"); setToast(true); clearEditDraft(); } }, [done]);
  sE(() => { if (!toast) return; const t = setTimeout(() => setToast(false), 5000); return () => clearTimeout(t); }, [toast]);
  const retry = () => { if (failed === "system" && typeof navigator !== "undefined" && navigator.onLine === false) return; setFailed(null); setProgress(failed === "timeout" ? progress : 0); setAttempt(a => a + 1); };
  if (failed) return <EditingFailed kind={failed} savedAt={savedAt} reason={failReason} onRetry={retry} onHome={() => resetToTab("home")} />;
  return (
    <div className="relative flex h-full flex-col bg-canvas">
      <StatusBar />
      {toast && <NotifToast text="사장님의 숏폼 편집이 완료되었어요" onClose={() => setToast(false)} />}
      <div className="flex flex-1 flex-col px-6 pt-6">
        <h1 className="text-[18px] font-bold tracking-tighter-title text-ink">AI 자동 편집</h1>
        <p className="mt-1 text-[14px] text-slate-muted">촬영본을 숏폼으로 만드는 중이에요.</p>
        {/* 편집 중 무한 로딩 — 클립 3개가 블랍으로 합쳐져 완성 영상이 되는 루프 */}
        <div className="relative mx-auto mt-6 flex h-[212px] w-full items-center justify-center overflow-hidden rounded-[32px] bg-surface">
          <div className="vpl relative h-[170px] w-[200px]">
            <span className="vpl-halo" />
            <span className="vpl-row"><span /><span /><span /></span>
            <span className="vpl-blob" />
            <span className="vpl-eq"><i /><i /><i /></span>
            <span className="vpl-play" />
          </div>
        </div>
        <div className="mt-7 flex flex-col gap-2.5">
          {STEPS.map((s, i) => {
            const state = i < progress ? "done" : i === progress ? "loading" : "todo";
            return (
              <div key={s.id} className="flex items-center gap-3">
                {state === "done" && <I name="circle-check" size={22} color="#10b981" />}
                {state === "loading" && <I name="loader-circle" size={22} color="#2563eb" className="animate-spin" />}
                {state === "todo" && <I name="circle" size={22} color="#cbd5e1" />}
                <span className={`text-[15px] font-semibold ${state === "todo" ? "text-slate-muted" : "text-ink"}`}>{s.label}</span>
              </div>
            );
          })}

          <PrimaryButton disabled={!done} onClick={() => navigate("export")}>{done ? "완성된 영상 내보내기" : "편집 중..."}</PrimaryButton>
        </div>
      </div>
    </div>
  );
}

  return <img src={src} alt="" className="shrink-0 object-contain" style={{ width: size + 14, height: size + 14 }} />;

/* ── 매장 메뉴 관리 — 사진·메뉴명·가경을 한 행에서 고치는 수평 리스트 카드 ── */
function MenuRow({ item, onChange, onRemove, onDragStart, onDragOver, onDrop, dragging }) {
  const fileRef = React.useRef(null);
  const priceText = item.price || item.price === 0 ? Number(item.price).toLocaleString() : "";

    <div draggable onDragStart={onDragStart} onDragOver={onDragOver} onDrop={onDrop} onDragEnd={onDrop}
      className={`flex items-center gap-3 rounded-xl border border-hairline bg-panel p-3 transition-opacity ${dragging ? "opacity-40" : ""}`}>
      <input ref={fileRef} type="file" accept="image/*" className="hidden" aria-hidden="true"
        onChange={e => { const f = e.target.files && e.target.files[0]; if (f) onChange({ ...item, image: URL.createObjectURL(f) }); e.target.value = ""; }} />
      <div className="relative h-[76px] w-[76px] shrink-0 overflow-hidden rounded-lg bg-slate-100">
        {item.image ? (
          <React.Fragment>
            <img src={item.image} alt={item.name || "메뉴 사진"} className="h-full w-full object-cover" />
            <button onClick={() => onChange({ ...item, image: null })} aria-label="사진 삭제"

          </React.Fragment>
        ) : (
          <button onClick={() => fileRef.current && fileRef.current.click()} aria-label="사진 추가"
            className="flex h-full w-full flex-col items-center justify-center gap-1 border border-dashed border-slate-300 text-slate-400 active:scale-95 transition-transform">
            <I name="image-plus" size={20} /><span className="text-[10px] font-semibold">사진</span>
          </button>
        )}
      </div>
      <div className="flex min-w-0 flex-1 flex-col gap-2">
        <input value={item.name} onChange={e => onChange({ ...item, name: e.target.value })} placeholder="메뉴명을 입력하세요" aria-label="메뉴명"
          className="h-9 w-full rounded-lg border border-hairline bg-surface px-2.5 text-[14px] font-semibold text-ink outline-none placeholder:font-medium placeholder:text-slate-muted focus:border-brand-border" />
        <div className="flex h-9 items-center gap-1 rounded-lg border border-hairline bg-surface px-2.5">
          <input value={priceText} onChange={e => { const d = e.target.value.replace(/\D/g, ""); onChange({ ...item, price: d ? +d : null }); }} inputMode="numeric" placeholder="0" aria-label="가경"
            className="min-w-0 flex-1 bg-transparent text-[14px] font-medium tabular-nums text-ink outline-none placeholder:text-slate-muted" />
          <span className="shrink-0 text-[13px] font-medium text-slate-muted">원</span>
        </div>
      </div>
      <div className="flex shrink-0 flex-col items-center justify-between gap-2 self-stretch">
        <button onClick={onRemove} aria-label={`${item.name || "메뉴"} 삭제`} className="flex h-8 w-8 items-center justify-center rounded-lg text-slate-500 active:scale-90 transition-transform"><I name="trash-2" size={17} /></button>

      </div>
    </div>
  );
}
function MenuManager({ menus, onChange }) {
  const [drag, setDrag] = mS(null);
  const move = to => {
    if (drag === null || drag === to) return;
    const next = menus.slice(); const [row] = next.splice(drag, 1); next.splice(to, 0, row);
    onChange(next); setDrag(to);
  };
  return (
    <div>
      <div className="mb-1.5 flex items-center gap-2 pl-1">
        <span className="text-[12px] font-medium text-slate-muted">매장 메뉴 관리</span>
        <span className="text-[11px] font-medium text-slate-muted">총 {menus.length}개</span>
      </div>
      <div className="flex flex-col gap-2">
        {menus.map((m, i) => (
          <MenuRow key={m.id} item={m} dragging={drag === i}
            onChange={next => onChange(menus.map(x => x.id === m.id ? next : x))}
            onRemove={() => onChange(menus.filter(x => x.id !== m.id))}
            onDragStart={() => setDrag(i)} onDragOver={e => { e.preventDefault(); move(i); }} onDrop={() => setDrag(null)} />
        ))}
      </div>
      <button onClick={() => onChange([...menus, { id: `m_${Date.now()}`, name: "", price: null, image: null }])}
        className="mt-2.5 flex w-full items-center justify-center gap-2 rounded-xl border-2 border-dashed border-slate-300 py-3.5 text-[14px] font-semibold text-slate-500 active:scale-[0.99] transition-transform">
        <I name="plus" size={18} />새 메뉴 추가하기
      </button>
    </div>
  );
}

function LineChart({ data = REALS.WEEK_VIEWS, color = "#2563EB", gid = "areaFill" }) {
  const w = 329, h = 132, pad = 8;
  const max = Math.max(...data.map(d => d.value)), min = Math.min(...data.map(d => d.value));
  const stepX = (w - pad * 2) / (data.length - 1);
  const points = data.map((d, i) => ({ x: pad + i * stepX, y: pad + (1 - (d.value - min) / (max - min || 1)) * (h - pad * 2), ...d }));
  const line = points.map((p, i) => { if (i === 0) return `M ${p.x} ${p.y}`; const prev = points[i - 1]; const cx = (prev.x + p.x) / 2; return `C ${cx} ${prev.y} ${cx} ${p.y} ${p.x} ${p.y}`; }).join(" ");
  const area = `${line} L ${points[points.length - 1].x} ${h} L ${points[0].x} ${h} Z`;
  return (
    <div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} className="overflow-visible">
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.18" /><stop offset="100%" stopColor={color} stopOpacity="0" /></linearGradient></defs>
        <path d={area} fill={"url(#" + gid + ")"} className="fade-in" />
        <path d={line} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" style={{ strokeDasharray: 1000, strokeDashoffset: 1000, animation: "draw-line 1s ease-in-out forwards" }} />
        {points.map(p => <circle key={p.day} cx={p.x} cy={p.y} r="3" fill="#fff" stroke={color} strokeWidth="2" />)}
      </svg>
      <div className="mt-1.5 flex justify-between px-1">{data.map(d => <span key={d.day} className="text-[11px] text-slate-muted">{d.day}</span>)}</div>
    </div>
  );
}

function Donut({ segs, center, size = 66, duration = 1200 }) {
  const r = 40, CIRC = 2 * Math.PI * r;
  const total = segs.reduce((a, sg) => a + sg.value, 0) || 100;
  /* 탭 진입(마운트)마다 12시 방향에서 시계방향으로 차오른다 */
  const [drawn, setDrawn] = mS(false);
  React.useEffect(() => {
    const id = requestAnimationFrame(() => requestAnimationFrame(() => setDrawn(true)));
    return () => cancelAnimationFrame(id);
  }, []);
  let acc = 0;
  const arcs = segs.map(sg => {
    const len = CIRC * sg.value / total;
    const startFrac = acc / CIRC;
    const el = (
      <circle key={sg.label} cx="50" cy="50" r={r} fill="none" stroke={sg.color} strokeWidth="17"
        strokeDasharray={len + " " + (CIRC - len)}
        strokeDashoffset={drawn ? 0 : len}
        style={{
          transform: "rotate(" + (startFrac * 360) + "deg)",
          transformOrigin: "50px 50px",
          transition: "stroke-dashoffset " + Math.round(duration * (len / CIRC)) + "ms cubic-bezier(0.16, 1, 0.3, 1)",
          transitionDelay: Math.round(duration * startFrac) + "ms"
        }} />
    );
    acc += len;
    return el;
  });
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <svg viewBox="0 0 100 100" width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx="50" cy="50" r={r} fill="none" stroke="#F1F5F9" strokeWidth="17" />
        {arcs}
      </svg>
      <div className="absolute inset-0 flex items-center justify-center">
        <span className="text-[12px] font-bold tracking-tighter-title text-ink" style={{ color: "#2563EB" }}>{center}</span>
      </div>
    </div>
  );
}

  const total = segs.reduce((a, sg) => a + sg.value, 0) || 100;
  const max = Math.max.apply(null, segs.map(sg => sg.value));
  const [drawn, setDrawn] = mS(false);
  React.useEffect(() => {
    const id = requestAnimationFrame(() => requestAnimationFrame(() => setDrawn(true)));

  }, []);
  return (

function PipGuideV2({ src, width = 90 }) {
  const PW = 393, PH = 852, H = Math.round(width * 16 / 9);
  const [pos, setPos] = React.useState({ x: 16, y: 102 });
  const [expanded, setExpanded] = React.useState(false);
  const onPointerDown = e => {
    const sx = e.clientX, sy = e.clientY, ox = pos.x, oy = pos.y;
    const move = ev => setPos({
      x: Math.max(8, Math.min(PW - width - 8, ox + ev.clientX - sx)),
      y: Math.max(102, Math.min(PH - H - 200, oy + ev.clientY - sy))
    });
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  };
  if (expanded) return (
    <div className="absolute inset-0 z-40 flex items-center justify-center overflow-hidden bg-ink">

  { sel: '[data-coach="make"]', tab: "home", title: "촬영 준비", body: "누르면 해당 숏폼의 촬영 가이드를 보고 따라 촬영할 수 있어요. 이어서 AI가 자동으로 편집해줘요.", pad: 6, radius: 999 },

  { sel: '[data-coach="tab-chat"]', tab: "chat", title: "AI 추천 숏폼", body: "몇 가지 질문에 답하면 매장에 맞는 촬영 구성을 추천해줘요.", pad: 8, radius: 16 },

          transition: "left .28s cubic-bezier(.22,1,.36,1), top .28s cubic-bezier(.22,1,.36,1), width .28s, height .28s, border-radius .28s"
        }} />
      {/* 가이드 툴팁 — 글래스 카드 */}
      <div className="absolute pop-in" style={{ left: 16, right: 16, top: tipTop ?? undefined, bottom: tipBottom ?? undefined }}>
        {!fixedTip && <span aria-hidden="true" className="absolute h-3 w-3 rotate-45"
          style={{ left: caretX - 22, [below ? "top" : "bottom"]: -5, borderRadius: 2, background: "#ffffff" }} />}

            <button onClick={finish} className="-mr-1 whitespace-nowrap px-1 py-0.5 text-[12.5px] font-semibold active:scale-95" style={{ color: "#64748b" }}>건너뛰기</button>

<script type="text/babel" data-presets="react">
const SCREEN_NAMES = {
  home: "HomeScreen", saved: "SavedScreen", chat: "ChatScreen",
  "shoot-topic": "ShootTopicScreen", format: "FormatScreen", camera: "CameraScreen",
  editing: "EditingScreen", export: "ExportScreen",

  insight: "InsightScreen", settings: "SettingsScreen", plans: "PlansScreen", faq: "FaqScreen",
  states: "StatesCatalogScreen"
};
/* 모든 화면은 렌더 시점에 전역에서 찾는다 — babel 스크립트 로드 순서에 의지하지 않기 위해 */
const SCREENS = {
  terms: () => <LegalScreen variant="terms" />, privacy: () => <LegalScreen variant="privacy" />
};
Object.keys(SCREEN_NAMES).forEach(id => { SCREENS[id] = props => React.createElement(window[SCREEN_NAMES[id]], props); });
const PUSH_SCREENS = new Set(["format","camera","editing","export","insight","settings","edit-profile","my-video","plans","faq","terms","privacy","shoot-topic","states"]);
const DEPTH = { home:5, saved:5, chat:5, mypage:5, "shoot-topic":6, format:6, insight:6, settings:6, "edit-profile":6, "my-video":6, camera:7, plans:7, faq:7, terms:7, privacy:7, states:7, editing:8, export:9 };

function Router() {
  const { screen, TAB_SCREENS, goTab } = useApp();
  const Active = SCREENS[screen];
  const prevRef = React.useRef(screen);
  const prev = prevRef.current;
  const isTab = TAB_SCREENS.includes(screen);
  const wasTab = TAB_SCREENS.includes(prev);
  React.useEffect(() => { prevRef.current = screen; }, [screen]);
  const push = PUSH_SCREENS.has(screen) || PUSH_SCREENS.has(prev);
  const dir = (DEPTH[screen] ?? 5) >= (DEPTH[prev] ?? 5) ? 1 : -1;
  const animClass = screen === prev || (isTab && wasTab) ? ""
    : push ? (dir >= 0 ? "screen-push" : "screen-pop") : "fade-in";
  return (
    <PhoneShell>
      {isTab ? (
        <div key="tab-pager" className={`absolute inset-0 ${animClass}`}>
          <TabPager tabs={TAB_SCREENS} active={screen} onChange={goTab}>
            {id => React.createElement(SCREENS[id])}
          </TabPager>
        </div>
      ) : (
        <div key={screen} className={`absolute inset-0 ${animClass}`} data-screen-label={screen}>
          <Active />
        </div>
      )}
      {isTab && <TabBar />}
      {isTab && <CoachMarks />}
    </PhoneShell>
  );
}
/* 화면 파일이 전역 등록을 마친 뒤에 마운트한다 */
const NEEDED = ["AppProvider", "PhoneShell", "TabBar", "TabPager", "CoachMarks", "useApp", ...Object.values(SCREEN_NAMES), "LegalScreen"];
const mount = () => {
  if (NEEDED.some(n => typeof window[n] === "undefined")) { setTimeout(mount, 30); return; }
  ReactDOM.createRoot(document.getElementById("root")).render(<AppProvider initial="home"><Router /></AppProvider>);
};
mount();
</script>
